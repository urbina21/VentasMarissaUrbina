<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE USUARIOS</a>
</nav>

<div class="agregar_contenedor"></div>
<div class="row mt-5">
<div class="card">
    <div class="card-body">
        <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="AgregarValor()" novalidate >
          <div class="form-group">
            <label for="" class="control-label" hidden>Registro No.</label>
                <input type="text"  readonly="readonly"  [(ngModel)]="user.userid" name="userid" placeholder="No" class="form-control" required hidden>
          </div>                 

                            <div class="form-group">
                  <label for="" class="control-label">Empresa</label>
                  <select type="text"  [(ngModel)]="user.idempresa"  name="idempresa" placeholder="Seleccione la Empresa"  class="form-control" autofocus>
                    <option value="">Seleccione la Empresa</option>
                    <option *ngFor="let empresa of Empresalist" [value]="empresa.idempresa">{{ empresa.nombre }}</option>
                  </select>
              </div>

              <div class="form-group">
                <label for="" class="control-label">Sucursal</label>
                <select type="text"  [(ngModel)]="user.idsuc"  name="idsuc" placeholder="Seleccione la Sucursal"  class="form-control" autofocus>
                  <option value="">Seleccione la Sucursal</option>
                  <option *ngFor="let sucursal of Sucursallist" [value]="sucursal.idsuc">{{ sucursal.sucursal }}</option>
                </select>
              </div>

              <div class="form-group">
                <label class="control-label">Tipo Usuario</label>
                <select class="form-control" [(ngModel)]="user.idtpusuario" name="idtpusuario" required autofocus>
                  <option value="" disabled selected>Seleccione el Tipo de Usuario</option>
                  <option *ngFor="let item of TipoUsuariolist" value="{{item.idtpusuario}}">{{item.tipo}}</option>
                </select>
              </div>

              <div class="form-group">
                <label for="" class="control-label">ID Empleado</label>
                  <select class="form-control" [(ngModel)]="user.idemp" name="idemp" required autofocus>
                  <option value="" disabled selected>Seleccione el Empleado</option>
                  <option *ngFor="let item of Empleadoslist" value="{{item.idemp}}">{{item.idemp}}</option>
                </select>
              </div>
              <div class="form-group">
                <label for="" class="control-label">Usuario</label>
                <input type="text"  [(ngModel)]="user.usuario"  name="usuario" placeholder="DIGITE EL USUARIO"  class="form-control" autofocus>
              </div>
              <div class="form-group">
                <label for="" class="control-label">Clave</label>
                <input type="password"  [(ngModel)]="user.clave"  name="clave" placeholder="DIGITE LA CLAVE"  class="form-control" autofocus>
              </div>
              <div class="form-group">
                <label for="" class="control-label">Tipo</label>
                <input type="text"  [(ngModel)]="user.tipo"  name="tipo" placeholder="DIGITE EL TIPO"  class="form-control" autofocus>
              </div>   
          <button type="submit" class="btn btn-primary" formnovalidate value="Save" onclick="javascript:alert('Registro Almacenado')">
              Agregar
          </button>
        </form>
    </div>
</div>
</div>
<div>
 <input type="text" class="form-control mt-4" name="filterPost" placeholder="Digite el usuario que desea Buscar" [(ngModel)]="filterPost">
</div>
<br>

 <div class="container">  
  <button (click)="exportToExcel()" class="btn btn-secondary">Exportar a Excel</button>
&nbsp;&nbsp; <button class="btn btn-dark" (click)="openPDF()">Descargar PDF</button>
    <div class="row mt-25">         
   <table class="table table-bordered table-hover" id="tabla">
      <thead>
        <tr>
            <th>NO</th>
            <th>EMPRESA</th>
            <th>SUCURSAL</th>
            <th>TIPO USUARIO</th>
            <th>EMPLEADO</th>          
            <th>USUARIO</th>
            <th>TIPO</th>
            <th>ESTADO</th>
        </tr>
      </thead>
    <tbody>
                <tr *ngFor="let User of TUser | filterusuario:filterPost">
                    <td >{{User.userid}}</td>
                    <td >{{User.idempresa}}</td>
                    <td >{{User.idsuc}}</td>
                    <td >{{User.idtpusuario}}</td>
                    <td >{{User.idemp}}</td>
                    <td >{{User.usuario}}</td>
                    <td >{{User.tipo}}</td>
                    <td >{{User.estado}}</td>
                    <td>  <button  class="btn btn-danger"  (click)="EliminarData(User.userid)" onclick="javascript:alert('Registro Eliminado')" >Eliminar</button> </td>
                    <td>
                    <button  class="btn btn-success" [routerLink]="['/usuario/edit', User.userid]">
                    Actualizar
              </button>
</td>
                  </tr>
     </tbody>
   </table>
</div>
</div>
