<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE ÁREAS DE TRABAJO</a>
</nav>

<div class="agregar_contenedor"></div>
<div class="row mt-5">
<div class="card">
    <div class="card-body">
        <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="AgregarValor()" novalidate >
          <div class="form-group">
            <label for="" class="control-label" hidden>Registro No.</label>
                <input type="text"  readonly="readonly"  [(ngModel)]="user.idarea" name="idarea" placeholder="No" class="form-control" required hidden>
          </div>                 

                            <div class="form-group">
                  <label for="" class="control-label">Empresa</label>
                  <select type="text"  [(ngModel)]="user.idempresa"  name="idempresa" placeholder="Seleccione la Empresa"  class="form-control" autofocus>
                    <option value="">Seleccione la Empresa</option>
                    <option *ngFor="let empresa of Empresalist" [value]="empresa.idempresa">{{ empresa.nombre }}</option>
                  </select>
              </div>

              <div class="form-group">
                <label for="" class="control-label">Sucursal</label>
                <select type="text"  [(ngModel)]="user.idsuc"  name="idsuc" placeholder="Seleccione la Sucursal"  class="form-control" autofocus>
                  <option value="">Seleccione la Sucursal</option>
                  <option *ngFor="let sucursal of Sucursallist" [value]="sucursal.idsuc">{{ sucursal.sucursal }}</option>
                </select>
              </div>
              
              <div class="form-group">
                <label for="" class="control-label">Área</label>
                <input type="text"  [(ngModel)]="user.area"  name="area" placeholder="DIGITE EL AREA"  class="form-control" autofocus>
              </div>
              <div class="form-group">
                <label for="" class="control-label">Fecha Creación</label>
                <input type="date"  [(ngModel)]="user.fecha_creacion"  name="fecha_creacion" class="form-control">
              </div>   
          <button type="submit" class="btn btn-primary" formnovalidate value="Save" onclick="javascript:alert('Registro Almacenado')">
              Agregar
          </button>
        </form>
    </div>
</div>
</div>

<div>
 <input type="text" class="form-control mt-4" name="filterPost" placeholder="Digite el área que desea Buscar" [(ngModel)]="filterPost">
</div>


<br>

 <div class="container">  
  <button (click)="exportToExcel()" class="btn btn-secondary">Exportar a Excel</button>
&nbsp;&nbsp; <button class="btn btn-dark" (click)="openPDF()">Descargar PDF</button>`
    <div class="row mt-25">         
   <table class="table table-bordered table-hover" id="tabla">
      <thead>
        <tr>
            <th>NO</th>
            <th>EMPRESA</th>
            <th>SUCURSAL</th>
            <th>AREA</th>
            <th>FECHA CREACION</th>          
            <th>ESTADO</th>
        </tr>
      </thead>
    <tbody>
                <tr *ngFor="let User of TUser | filterareastrabajo:filterPost">
                    <td >{{User.idarea}}</td>
                    <td >{{User.idempresa}}</td>
                    <td >{{User.idsuc}}</td>
                    <td >{{User.area}}</td>
                    <td >{{User.fecha_creacion}}</td>
                    <td >{{User.estado}}</td>
                    <td>  <button  class="btn btn-danger"  (click)="EliminarData(User.idarea)" onclick="javascript:alert('Registro Eliminado')" >Eliminar</button> </td>
                    <td>
                    <button  class="btn btn-success" [routerLink]="['/areas_trabajo/edit', User.idarea]">
                    Actualizar
              </button>
</td>
                  </tr>
     </tbody>
   </table>
</div>
</div>
