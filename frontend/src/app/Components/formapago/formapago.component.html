<nav class="navbar navbar-dark bg-dark">
  <a href="/" class="navbar-brand">REGISTRO DE FORMA DE PAGO</a>
</nav>

<div class="agregar_contenedor"></div>
<div class="row mt-5">
<div class="card">
    <div class="card-body">
        <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="AgregarValor()" novalidate >
          <div class="form-group">
            <label for="" class="control-label" hidden>Registro No.</label>
                <input type="text"  readonly="readonly"  [(ngModel)]="user.idfpago" name="idfpago" placeholder="No" class="form-control" required hidden>
          </div>                 

              <div class="form-group">
                  <label for="" class="control-label">Empresa</label>
                  <select type="text"  [(ngModel)]="user.idempresa"  name="idempresa" placeholder="Seleccione la Empresa"  class="form-control" autofocus>
                    <option value="">Seleccione la Empresa</option>
                    <option *ngFor="let empresa of Empresalist" [value]="empresa.idempresa">{{ empresa.nombre }}</option>
                  </select>
              </div>
              
              <div class="form-group">
                <label for="" class="control-label">Forma de Pago</label>
                <input type="text"  [(ngModel)]="user.formapago"  name="formapago" placeholder="DIGITE LA FORMA DE PAGO"  class="form-control" autofocus>
              </div>   
          <button type="submit" class="btn btn-primary" formnovalidate value="Save" onclick="javascript:alert('Registro Almacenado')">
              Agregar
          </button>
        </form>
    </div>
</div>
</div>

<div>
 <input type="text" class="form-control mt-4" name="filterPost" placeholder="Digite la forma de pago que desea buscar" [(ngModel)]="filterPost">
</div>

<br>

 <div class="container">
  <button (click)="exportToExcel()" class="btn btn-secondary">Exportar a Excel</button>
&nbsp;&nbsp; <button class="btn btn-dark" (click)="openPDF()">Descargar PDF</button>`  
    <div class="row mt-25">         
   <table class="table table-bordered table-hover" id="tabla">
      <thead>
        <tr>
            <th>NO</th>
            <th>EMPRESA</th>
            <th>FORMA PAGO</th>          
            <th>ESTADO</th>
        </tr>
      </thead>
    <tbody>
                <tr *ngFor="let User of TUser | filterformapago:filterPost">
                    <td >{{User.idfpago}}</td>
                    <td >{{User.idempresa}}</td>
                    <td >{{User.formapago}}</td>
                    <td >{{User.estado}}</td>
                    <td>  <button  class="btn btn-danger"  (click)="EliminarData(User.idfpago)" onclick="javascript:alert('Registro Eliminado')" >Eliminar</button> </td>
                    <td>
                    <button  class="btn btn-success" [routerLink]="['/formapago/edit', User.idfpago]">
                    Actualizar
              </button>
</td>
                  </tr>
     </tbody>
   </table>
</div>
</div>
